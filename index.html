<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول - حاضر (تجريبي)</title>

<!-- إجبار النظام والمتصفح على استخدام الوضع الفاتح فقط -->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#087f5b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23087f5b'/%3E%3Cpath d='M18 33l10 10 18-20' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme: light;
  --ink:#16483B; --mut:#628278; --line:#DCECE5; --surface:#F4F9F7;
  --prim:#087f5b; --prim-deep:#056044; --prim-soft:#E7F5EF;
  --no-soft:#FBEAEA; --card:#FFFFFF;
  --ease-smooth: cubic-bezier(0.25,1,0.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:auto;user-select:auto}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--prim);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.page-background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 12% 12%, rgba(185,225,211,.4), transparent 42%),
    radial-gradient(circle at 88% 88%, rgba(185,225,211,.3), transparent 45%),
    var(--surface);
}

.gate{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:18px}

/* ===== بطاقة تسجيل الدخول ===== */
.card{
  width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 1px 2px rgba(8,127,91,.08),0 20px 50px -20px rgba(8,127,91,.2);
  display:none;flex-direction:column;overflow:hidden;position:relative;
}
.card.show{display:flex;animation:cardEnter .55s var(--ease-smooth) forwards}
@keyframes cardEnter{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

/* ===== اللوحة الخضراء العلوية (الهوية) ===== */
.welcome-panel{
  position:relative;overflow:hidden;padding:34px 20px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.22), transparent 42%),
    radial-gradient(circle at 85% 85%, rgba(2,44,30,.65), transparent 50%),
    linear-gradient(145deg,#10b981 0%,var(--prim) 52%,#034832 100%);
}
.bg-shape{position:absolute;border-radius:50%;pointer-events:none;
  background:linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.25);
}
.shape-1{width:100px;height:100px;top:-30px;right:-30px;animation:floatSlow 6s ease-in-out infinite alternate}
.shape-2{width:80px;height:80px;bottom:-20px;left:-20px;animation:floatSlow 7s ease-in-out 1s infinite alternate-reverse}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}

.brand-circle{
  position:relative;width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(255,255,255,.75);
  background:linear-gradient(135deg, rgba(255,255,255,.25) 0%, rgba(255,255,255,.05) 100%);
  box-shadow:0 15px 35px rgba(0,0,0,.2), inset 0 1.5px 2px rgba(255,255,255,.8);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#fff;z-index:1;
}
/* حلقة النبض: تبقى مخفية إلى أن ينتهي أنيميشن الظهور، حينها تضاف كلاس pulsing عبر الجافاسكربت */
.brand-circle::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.85);opacity:0;pointer-events:none;z-index:-1;
}
.brand-circle.pulsing::before{animation:auraPulse 2.8s var(--ease-smooth) infinite}
@keyframes auraPulse{0%{transform:scale(.96);opacity:.8}100%{transform:scale(1.35);opacity:0}}

.brand-icon-svg{width:32px;height:32px;stroke:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2))}
.brand-title{font-size:22px;font-weight:800;color:#fff;margin:0;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.2)}

/* ===== القسم الأبيض (النموذج) ===== */
.login-panel{padding:28px 24px 24px}
.login-header{text-align:center;margin-bottom:20px}
.login-title{font-family:'Tajawal',sans-serif;text-align:center;font-size:23px;font-weight:800;color:var(--prim-deep)}
.login-sub{text-align:center;font-size:13px;color:var(--mut);margin:4px 0 0}

.err{display:none;background:var(--no-soft);color:#991B1B;border:1px solid #F3C6C6;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.err.show{display:block}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.lbl{font-size:12px;font-weight:600;color:var(--mut)}
.inp-wrap{position:relative}
.inp-wrap svg.ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;width:17px;height:17px;color:var(--mut);pointer-events:none;transition:color .15s}
.inp-wrap:focus-within svg.ic{color:var(--prim)}
.inp{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:9px 12px 9px 12px;padding-inline-start:38px;font-size:14.5px;min-height:44px;transition:border-color .15s,box-shadow .15s;
}
.inp:-webkit-autofill,.inp:-webkit-autofill:hover,.inp:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0px 1000px #fff inset;
  transition:background-color 5000s ease-in-out 0s;
}
.inp-wrap .toggle-pw{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:6px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--mut)}
.inp-wrap .toggle-pw:hover{background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--prim);box-shadow:0 0 0 3px var(--prim-soft);outline:none}

.btn{
  width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#0ba375 0%,var(--prim) 100%);color:#fff;border-radius:10px;padding:10px 16px;min-height:44px;
  font-size:14.5px;font-weight:700;margin-top:8px;
  box-shadow:0 6px 20px rgba(8,127,91,.22);transition:background .15s,transform .15s,box-shadow .2s;
}
.btn:hover{background:linear-gradient(135deg,#08835e 0%,var(--prim-deep) 100%);transform:translateY(-2px);box-shadow:0 10px 24px rgba(8,127,91,.32)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.65;pointer-events:none;transform:none}

.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.bspin{width:44px;height:44px;border:4px solid var(--prim-soft);border-top-color:var(--prim);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{font-size:11.5px;color:var(--mut)}

/* ===== أنيميشن الظهور المتسلسل داخل البطاقة ===== */
.cascade-item{opacity:0;animation:cascadeUp .45s var(--ease-smooth) forwards;will-change:transform,opacity}
@keyframes cascadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.delay-1{animation-delay:.05s}
.delay-2{animation-delay:.18s}
.delay-3{animation-delay:.31s}
.delay-4{animation-delay:.44s}
.delay-5{animation-delay:.57s}

@media (prefers-reduced-motion:reduce){
  .cascade-item{opacity:1!important}
  .brand-circle.pulsing::before{opacity:0!important}
}
</style>
</head>
<body>

<div class="page-background" aria-hidden="true"></div>

<div class="gate">
  <div class="bspin" id="chk"></div>
  <div id="chkMsg" style="display:none;max-width:420px;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.9"></div>
  <script>
  (function () {
    var BTN = '<button onclick="location.reload()" style="margin-top:10px;background:#087f5b;color:#fff;border:none;border-radius:9px;padding:9px 22px;font:inherit;font-weight:600;cursor:pointer">إعادة التحميل</button>';
    function live() { var c = document.getElementById("chk"); return c && c.style.display !== "none"; }
    function show(msg) {
      if (!live()) return;
      var m = document.getElementById("chkMsg");
      m.style.display = "block";
      m.innerHTML = 'صار خطأ بالتحميل:<br><code style="direction:ltr;display:inline-block;max-width:86vw;overflow-wrap:anywhere;background:var(--card);border:1px solid #DCECE5;border-radius:8px;padding:6px 10px;font-size:11px;margin:8px 0">' + String(msg).slice(0, 300) + '</code>' + BTN;
    }
    var t = setTimeout(function () {
      if (!live()) return;
      var m = document.getElementById("chkMsg");
      m.style.display = "block";
      m.innerHTML = 'التحميل متأخر أكثر من المعتاد…<br>تأكد من الإنترنت أو حدّث تحديثاً قوياً (Ctrl+F5).' + BTN;
    }, 12000);
    window.__bootDone = function () { clearTimeout(t); };
    window.addEventListener("error", function (e) {
      show((e.message || "خطأ غير معروف") + (e.filename ? " - " + String(e.filename).split("/").pop() : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      show((e.reason && (e.reason.message || e.reason)) || "رفض غير معالج");
    });
  })();
  </script>

  <div class="card" id="card">
    <!-- اللوحة الخضراء: هوية النظام -->
    <aside class="welcome-panel">
      <div class="bg-shape shape-1"></div>
      <div class="bg-shape shape-2"></div>
      <div class="cascade-item delay-1" id="brandWrap">
        <div class="brand-circle" id="brandCircle">
          <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <h2 class="brand-title">حاضر</h2>
        </div>
      </div>
    </aside>

    <!-- القسم الأبيض: نموذج تسجيل الدخول -->
    <section class="login-panel">
      <header class="login-header cascade-item delay-2">
        <h1 class="login-title">تسجيل الدخول</h1>
        <p class="login-sub">نظام حضور الطلاب - سجّل دخولك للمتابعة</p>
      </header>

      <div class="err" id="aErr"></div>

      <div class="field cascade-item delay-3">
        <label class="lbl" for="aEmail">البريد الإلكتروني</label>
        <div class="inp-wrap">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 6 10-6"/></svg>
          <input class="inp" id="aEmail" type="email" dir="ltr" autocomplete="username" placeholder="you@example.com">
        </div>
      </div>
      <div class="field cascade-item delay-4" style="margin-bottom:6px">
        <label class="lbl" for="aPass">كلمة السر</label>
        <div class="inp-wrap">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input class="inp" id="aPass" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="toggle-pw" id="btnTogglePw" aria-label="إظهار كلمة السر" tabindex="-1">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn cascade-item delay-5" id="btnLogin">تسجيل الدخول</button>
    </section>
  </div>

  <p class="foot">بعد الدخول تنتقل تلقائياً إلى صفحة النظام</p>
</div>

<script type="module">
/* إعدادات Firebase - مشروع labs-a4765 */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDMUlwIrd2wb11xgiS-vKqeJEuTYPY9YmA",
  authDomain: "test-labs-1cb92.firebaseapp.com",
  projectId: "test-labs-1cb92",
  storageBucket: "test-labs-1cb92.firebasestorage.app",
  messagingSenderId: "602549047680",
  appId: "1:602549047680:web:b915fe8aed877cc04bf165"
};

/* إيميل المشرف - يطابق نفس القيمة بملف LABS.html */
const ADMIN_EMAIL = "hasanhasan12331233@gmail.com";
/* أقصى مدة جلسة قبل تسجيل خروج إجباري (يومين) - احتراز أمني بسيط */
const SESSION_MAX_MS = 2 * 24 * 60 * 60 * 1000;

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

function showGateError(msg) {
  if (window.__bootDone) window.__bootDone();
  $("#chk").style.display = "none";
  $("#card").classList.add("show");
  const e = $("#aErr"); e.textContent = msg; e.classList.add("show");
}

onAuthStateChanged(auth, async u => {
  if (window.__bootDone) window.__bootDone();
  if (!u) {
    $("#chk").style.display = "none";
    $("#card").classList.add("show");
    setTimeout(() => $("#aEmail").focus(), 60);
    return;
  }
  const isAdmin = (u.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
  if (isAdmin) {
    try { localStorage.setItem("hadhir.sessionStart", String(Date.now())); } catch {}
    location.replace("LABS.html");
    return;
  }
  /* حساب أستاذ - تحقّق من ملفه بقاعدة البيانات قبل الدخول */
  try {
    const snap = await getDoc(doc(db, "staff", u.uid));
    if (!snap.exists() || snap.data().active !== true) {
      await signOut(auth);
      showGateError(snap.exists() ? "الحساب معطّل من قبل المشرف - راجعه لتفعيله." : "ما لكينا ملف صلاحيات لهذا الحساب - راجع المشرف.");
      return;
    }
    let start = null; try { start = Number(localStorage.getItem("hadhir.sessionStart")); } catch {}
    if (!start || isNaN(start)) { try { localStorage.setItem("hadhir.sessionStart", String(Date.now())); } catch {} }
    else if (Date.now() - start > SESSION_MAX_MS) {
      await signOut(auth);
      try { localStorage.removeItem("hadhir.sessionStart"); } catch {}
      showGateError("انتهت صلاحية الجلسة (يومين) - سجّل دخولك مجدداً.");
      return;
    }
    location.replace("LABS.html");
  } catch (err) {
    await signOut(auth);
    showGateError("تعذّر التحقق من الحساب - تأكد من الإنترنت وحاول مجدداً.");
  }
});

const AUTH_ERR = {
  "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
  "auth/user-not-found": "لا يوجد حساب بهذا البريد - تأكد من البريد أو راجع المشرف.",
  "auth/wrong-password": "كلمة السر غير صحيحة.",
  "auth/invalid-credential": "البريد أو كلمة السر غير صحيحة.",
  "auth/too-many-requests": "محاولات كثيرة - انتظر قليلاً ثم حاول مجدداً.",
  "auth/network-request-failed": "لا يوجد اتصال بالإنترنت - تسجيل الدخول يحتاج اتصالاً."
};
async function doLogin() {
  const btn = $("#btnLogin"), errB = $("#aErr");
  errB.classList.remove("show");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> جارٍ الدخول…';
  try {
    await signInWithEmailAndPassword(auth, $("#aEmail").value.trim(), $("#aPass").value);
    /* التحويل يصير تلقائياً من onAuthStateChanged */
  } catch (e) {
    errB.textContent = AUTH_ERR[e.code] || "تعذّر تسجيل الدخول (" + (e.code || e.message) + ")";
    errB.classList.add("show");
    btn.disabled = false; btn.textContent = "تسجيل الدخول";
  }
}
$("#btnLogin").onclick = doLogin;
$("#aPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("#aEmail").addEventListener("keydown", e => { if (e.key === "Enter") $("#aPass").focus(); });
$("#btnTogglePw").addEventListener("click", () => {
  const p = $("#aPass"), showing = p.type === "text";
  p.type = showing ? "password" : "text";
  $("#btnTogglePw").setAttribute("aria-label", showing ? "إظهار كلمة السر" : "إخفاء كلمة السر");
  $("#btnTogglePw").innerHTML = showing
    ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
    : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-7 0-11-7-11-7a19.4 19.4 0 0 1 4.2-5.2M9.9 4.2A9.7 9.7 0 0 1 12 4c7 0 11 7 11 7a19.4 19.4 0 0 1-2.2 3.1M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>';
});
</script>

<!-- سكريبت زخرفي بحت: نبضة الشعار بعد انتهاء ظهوره + تنظيف الأداء - لا يمس منطق الدخول أعلاه -->
<script>
(function () {
  var brandWrap = document.getElementById("brandWrap");
  var brandCircle = document.getElementById("brandCircle");
  if (brandWrap && brandCircle) {
    brandWrap.addEventListener("animationend", function onEnd(e) {
      if (e.target !== brandWrap) return;
      brandCircle.classList.add("pulsing");
      brandWrap.removeEventListener("animationend", onEnd);
    });
  }
  document.querySelectorAll(".cascade-item").forEach(function (el) {
    el.addEventListener("animationend", function onEnd(e) {
      if (e.target !== el) return;
      el.style.willChange = "auto";
      el.removeEventListener("animationend", onEnd);
    });
  });
})();
</script>
</body>
</html>
