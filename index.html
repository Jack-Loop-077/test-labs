<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- إجبار النظام والمتصفح على استخدام الوضع الفاتح فقط -->
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#087f5b" />
  <title>تسجيل الدخول - حاضر</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23087f5b'/%3E%3Cpath d='M18 33l10 10 18-20' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. المتغيرات والقواعد الأساسية (مع قفل الوضع الليلي)
       ========================================================================== */
    :root {
      color-scheme: light !important;
      --primary: #087f5b;
      --primary-dark: #056044;
      --primary-light: #e7f5ef;
      --mint: #b9e1d3;
      --text-main: #16483b;
      --text-muted: #628278;
      --border-color: #dcece5;
      --bg-main: #f4f9f7;
      --white: #ffffff;
      --error: #e63946;
      --error-soft: #fbeaea;
      --radius-card: clamp(20px, 4vw, 32px);
      --radius-md: clamp(10px, 2vw, 14px);
      --shadow-card: 0 20px 50px rgba(8, 127, 91, 0.12);
      --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root { color-scheme: light !important; }
      html, body {
        background-color: var(--bg-main) !important;
        color: var(--text-main) !important;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input {
      -webkit-user-select: auto;
      -moz-user-select: auto;
      -ms-user-select: auto;
      user-select: auto;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Tajawal", sans-serif;
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(12px, 3vw, 32px);
    }

    /* ==========================================================================
       2. الحركات والتأثيرات
       ========================================================================== */
    @keyframes cardEnter {
      from { opacity: 0; transform: translate3d(0, 22px, 0) scale(0.97); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes cascadeUp {
      from { opacity: 0; transform: translate3d(0, 14px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(0, -8px, 0) rotate(4deg); }
    }
    @keyframes auraPulse {
      0% { transform: scale(0.96); opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes sweepDotsDiagonal {
      0% { -webkit-mask-position: 0% 0%; mask-position: 0% 0%; }
      100% { -webkit-mask-position: 100% 100%; mask-position: 100% 100%; }
    }
    @keyframes rot { to { transform: rotate(360deg); } }

    .cascade-item {
      opacity: 0;
      animation: cascadeUp 0.45s var(--ease-smooth) forwards;
      will-change: transform, opacity;
    }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.18s; }
    .delay-3 { animation-delay: 0.31s; }
    .delay-4 { animation-delay: 0.44s; }
    .delay-5 { animation-delay: 0.57s; }

    /* ==========================================================================
       3. خلفية الصفحة
       ========================================================================== */
    .page-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 12% 12%, rgba(185, 225, 211, 0.45), transparent 42%),
        radial-gradient(circle at 88% 88%, rgba(185, 225, 211, 0.35), transparent 45%),
        var(--bg-main) !important;
    }

    /* ==========================================================================
       4. التخطيط العام + حالة التحميل (Boot Spinner)
       ========================================================================== */
    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .boot-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: rot 0.8s linear infinite;
    }

    .boot-msg {
      display: none;
      max-width: 420px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.9;
    }

    .boot-msg button {
      margin-top: 10px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 9px;
      padding: 9px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    /* ==========================================================================
       5. البطاقة (مخفية إلى أن يتم التحقق من الجلسة)
       ========================================================================== */
    .card-layout {
      width: clamp(320px, 92vw, 480px);
      display: none;
      flex-direction: column;
      background: var(--white) !important;
      border: 1px solid rgba(200, 230, 218, 0.9);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .card-layout.ready {
      display: flex;
      animation: cardEnter 0.55s var(--ease-smooth) forwards;
    }

    .page-foot {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ==========================================================================
       6. القسم العلوي الأخضر
       ========================================================================== */
    .welcome-panel {
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.22), transparent 42%),
        radial-gradient(circle at 85% 85%, rgba(2, 44, 30, 0.65), transparent 50%),
        linear-gradient(145deg, #10b981 0%, #087f5b 52%, #034832 100%) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(30px, 6vw, 50px) clamp(16px, 4vw, 24px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .bg-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.4) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(225deg, transparent 0%, rgba(0, 0, 0, 0.95) 35%, rgba(0, 0, 0, 1) 100%);
      mask-image: linear-gradient(225deg, transparent 0%, rgba(0, 0, 0, 0.95) 35%, rgba(0, 0, 0, 1) 100%);
      -webkit-mask-size: 260% 260%;
      mask-size: 260% 260%;
      animation: sweepDotsDiagonal 6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .shape-1 {
      width: clamp(70px, 18vw, 110px); height: clamp(70px, 18vw, 110px);
      top: -30px; right: -30px;
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .shape-2 {
      width: clamp(60px, 15vw, 90px); height: clamp(60px, 15vw, 90px);
      bottom: -20px; left: -20px;
      animation: floatSlow 7s ease-in-out 1s infinite alternate-reverse;
    }

    .brand-circle {
      position: relative;
      width: clamp(100px, 24vw, 135px);
      height: clamp(100px, 24vw, 135px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.75);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), inset 0 1.5px 2px rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--white) !important;
      z-index: 1;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .brand-circle:hover { transform: scale(1.04); }

    /* حلقة النبض: تبقى مخفية إلى أن ينتهي أنيميشن دخول الدائرة، حينها تُضاف كلاس pulsing بالجافاسكربت */
    .brand-circle::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    .brand-circle.pulsing::before {
      animation: auraPulse 2.8s var(--ease-smooth) infinite;
    }

    .brand-icon-svg {
      width: clamp(28px, 7vw, 38px);
      height: clamp(28px, 7vw, 38px);
      stroke: var(--white) !important;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
    }

    .brand-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      color: var(--white) !important;
      margin: 0;
      line-height: 1;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================================================
       7. القسم السفلي الأبيض (النموذج)
       ========================================================================== */
    .login-panel {
      padding: clamp(28px, 6vw, 42px) clamp(20px, 5vw, 36px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      background: linear-gradient(180deg, #ffffff 0%, #f7faf8 100%) !important;
    }

    .login-header { text-align: center; margin-bottom: clamp(20px, 4vw, 28px); }
    .login-title {
      margin: 0;
      color: var(--primary) !important;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .login-sub {
      margin: 6px 0 0;
      color: var(--text-muted) !important;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    .login-form { width: 100%; }
    .form-group { margin-bottom: clamp(14px, 3vw, 20px); }
    .form-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-main) !important;
      font-size: clamp(12.5px, 2.8vw, 14px);
      font-weight: 700;
    }

    .input-wrapper { position: relative; display: flex; align-items: center; }

    .form-input {
      width: 100%;
      height: clamp(46px, 10vw, 54px);
      border: 1.5px solid #d2e5dd;
      border-radius: var(--radius-md);
      background-color: #ffffff !important;
      color: var(--text-main) !important;
      font-family: inherit;
      font-size: clamp(13.5px, 3vw, 15px);
      outline: none;
      padding: 0 44px 0 44px;
      direction: ltr;
      text-align: left;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }

    .form-input:-webkit-autofill,
    .form-input:-webkit-autofill:hover,
    .form-input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text-main) !important;
      -webkit-box-shadow: 0 0 0px 1000px #ffffff inset !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .form-input::placeholder { color: #9cb2aa !important; }

    .form-input:focus {
      border-color: var(--primary) !important;
      background-color: var(--white) !important;
      box-shadow: 0 8px 22px rgba(8, 127, 91, 0.12), 0 0 0 3px rgba(8, 127, 91, 0.08);
      transform: translate3d(0, -1px, 0);
    }

    .input-icon {
      position: absolute;
      color: #7aa89a !important;
      width: clamp(17px, 4vw, 20px);
      height: clamp(17px, 4vw, 20px);
      pointer-events: none;
      transition: color 0.2s ease;
    }
    .input-icon.right-icon { right: 14px; }
    .form-input:focus ~ .input-icon.right-icon { color: var(--primary) !important; }

    .toggle-password-btn {
      position: absolute;
      left: 8px;
      background: transparent;
      border: none;
      padding: 6px;
      color: #7aa89a !important;
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: 8px;
      transition: color 0.2s ease, background-color 0.2s ease;
    }
    .toggle-password-btn:hover { color: var(--primary) !important; background: var(--primary-light) !important; }

    .submit-btn {
      position: relative;
      width: 100%;
      height: clamp(46px, 10vw, 54px);
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0ba375 0%, var(--primary) 100%) !important;
      color: var(--white) !important;
      font-family: inherit;
      font-size: clamp(14.5px, 3.2vw, 16px);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: clamp(14px, 3vw, 20px);
      box-shadow: 0 6px 20px rgba(8, 127, 91, 0.22);
      transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #08835e 0%, var(--primary-dark) 100%) !important;
      transform: translate3d(0, -2px, 0);
      box-shadow: 0 10px 24px rgba(8, 127, 91, 0.32);
    }
    .submit-btn:active { transform: translate3d(0, 0, 0); }
    .submit-btn:disabled { opacity: 0.7; cursor: default; pointer-events: none; }

    .btn-icon {
      width: clamp(16px, 3.5vw, 19px);
      height: clamp(16px, 3.5vw, 19px);
      stroke: var(--white) !important;
      transition: transform 0.2s ease;
    }
    .submit-btn:hover .btn-icon { transform: translate3d(-4px, 0, 0); }

    .btn-spin {
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rot 0.7s linear infinite;
    }

    .form-alert {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
    }
    .form-alert.show { display: block; }
    .form-alert.error {
      background-color: var(--error-soft) !important;
      color: #991b1b !important;
      border: 1px solid #f3c6c6;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .cascade-item { opacity: 1 !important; }
      .brand-circle.pulsing::before { opacity: 0 !important; }
    }
  </style>
</head>

<body>

  <div class="page-background" aria-hidden="true"></div>

  <main class="page-wrapper">

    <!-- حالة التحميل: تظهر لحد ما نتحقق من جلسة الدخول عبر Firebase -->
    <div class="boot-spinner" id="chk"></div>
    <div class="boot-msg" id="chkMsg"></div>
    <script>
    (function () {
      var BTN = '<button onclick="location.reload()">إعادة التحميل</button>';
      function live() { var c = document.getElementById("chk"); return c && c.style.display !== "none"; }
      function show(msg) {
        if (!live()) return;
        var m = document.getElementById("chkMsg");
        m.style.display = "block";
        m.innerHTML = 'صار خطأ بالتحميل:<br><code style="direction:ltr;display:inline-block;max-width:86vw;overflow-wrap:anywhere;background:#fff;border:1px solid #dcece5;border-radius:8px;padding:6px 10px;font-size:11px;margin:8px 0">' + String(msg).slice(0, 300) + '</code>' + BTN;
      }
      var t = setTimeout(function () {
        if (!live()) return;
        var m = document.getElementById("chkMsg");
        m.style.display = "block";
        m.innerHTML = 'التحميل متأخر أكثر من المعتاد…<br>تأكد من الإنترنت أو حدّث تحديثاً قوياً (Ctrl+F5).' + BTN;
      }, 12000);
      window.__bootDone = function () { clearTimeout(t); };
      window.addEventListener("error", function (e) {
        show((e.message || "خطأ غير معروف") + (e.filename ? " - " + String(e.filename).split("/").pop() : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        show((e.reason && (e.reason.message || e.reason)) || "رفض غير معالج");
      });
    })();
    </script>

    <!-- البطاقة: نفس التصميم المعتمد بالكامل، تظهر فقط بعد التحقق من الجلسة -->
    <div class="card-layout" id="card">

      <!-- القسم العلوي الأخضر -->
      <aside class="welcome-panel">
        <div class="bg-grid-pattern"></div>
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>

        <div class="cascade-item delay-1" id="brandWrap">
          <div class="brand-circle" id="brandCircle">
            <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
            <h2 class="brand-title">حاضر</h2>
          </div>
        </div>
      </aside>

      <!-- القسم السفلي الأبيض: نموذج تسجيل الدخول -->
      <section class="login-panel">
        <header class="login-header cascade-item delay-2">
          <h1 class="login-title">تسجيل الدخول</h1>
          <p class="login-sub">نظام حضور الطلاب - سجّل دخولك للمتابعة</p>
        </header>

        <div class="form-alert error" id="formError" role="alert"></div>

        <form class="login-form" id="loginForm" novalidate>

          <div class="form-group cascade-item delay-3">
            <label class="form-label" for="email">البريد الإلكتروني</label>
            <div class="input-wrapper">
              <input
                class="form-input"
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="username"
                required
              />
              <svg class="input-icon right-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
              </svg>
            </div>
          </div>

          <div class="form-group cascade-item delay-4">
            <label class="form-label" for="password">كلمة المرور</label>
            <div class="input-wrapper">
              <input
                class="form-input"
                id="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <svg class="input-icon right-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="10" width="14" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              </svg>
              <button
                type="button"
                class="toggle-password-btn"
                id="togglePassword"
                aria-label="إظهار كلمة المرور"
                tabindex="-1"
              >
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="submit-btn cascade-item delay-5" type="submit" id="submitBtn">
            <span id="submitBtnLabel">تسجيل الدخول</span>
            <svg class="btn-icon" id="submitBtnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5"/>
              <path d="m11 18-6-6 6-6"/>
            </svg>
          </button>

        </form>
      </section>

    </div>

    <p class="page-foot">بعد الدخول تنتقل تلقائياً إلى صفحة النظام</p>
  </main>

  <script type="module">
    /* إعدادات Firebase - مشروع labs-a4765 */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDMUlwIrd2wb11xgiS-vKqeJEuTYPY9YmA",

    };

    /* إيميل المشرف - يطابق نفس القيمة بملف LABS.html */
    const ADMIN_EMAIL = "hasanhasan12331233@gmail.com";
    /* أقصى مدة جلسة قبل تسجيل خروج إجباري (يومين) - احتراز أمني بسيط */
    const SESSION_MAX_MS = 2 * 24 * 60 * 60 * 1000;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = s => document.querySelector(s);
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function revealCard() {
      if (window.__bootDone) window.__bootDone();
      $("#chk").style.display = "none";
      $("#card").classList.add("ready");
    }

    function showGateError(msg) {
      revealCard();
      const box = $("#formError");
      box.textContent = msg;
      box.classList.add("show");
    }

    onAuthStateChanged(auth, async u => {
      if (!u) {
        revealCard();
        setTimeout(() => $("#email").focus(), 60);
        return;
      }
      const isAdmin = (u.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
      if (isAdmin) {
        try { localStorage.setItem("hadhir.sessionStart", String(Date.now())); } catch {}
        location.replace("LABS.html");
        return;
      }
      /* حساب أستاذ - تحقّق من ملفه بقاعدة البيانات قبل الدخول */
      try {
        const snap = await getDoc(doc(db, "staff", u.uid));
        if (!snap.exists() || snap.data().active !== true) {
          await signOut(auth);
          showGateError(snap.exists() ? "الحساب معطّل من قبل المشرف - راجعه لتفعيله." : "ما لكينا ملف صلاحيات لهذا الحساب - راجع المشرف.");
          return;
        }
        let start = null; try { start = Number(localStorage.getItem("hadhir.sessionStart")); } catch {}
        if (!start || isNaN(start)) { try { localStorage.setItem("hadhir.sessionStart", String(Date.now())); } catch {} }
        else if (Date.now() - start > SESSION_MAX_MS) {
          await signOut(auth);
          try { localStorage.removeItem("hadhir.sessionStart"); } catch {}
          showGateError("انتهت صلاحية الجلسة (يومين) - سجّل دخولك مجدداً.");
          return;
        }
        location.replace("LABS.html");
      } catch (err) {
        await signOut(auth);
        showGateError("تعذّر التحقق من الحساب - تأكد من الإنترنت وحاول مجدداً.");
      }
    });

    const AUTH_ERR = {
      "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
      "auth/user-not-found": "لا يوجد حساب بهذا البريد - تأكد من البريد أو راجع المشرف.",
      "auth/wrong-password": "كلمة السر غير صحيحة.",
      "auth/invalid-credential": "البريد أو كلمة السر غير صحيحة.",
      "auth/too-many-requests": "محاولات كثيرة - انتظر قليلاً ثم حاول مجدداً.",
      "auth/network-request-failed": "لا يوجد اتصال بالإنترنت - تسجيل الدخول يحتاج اتصالاً."
    };

    async function doLogin() {
      const btn = $("#submitBtn"), label = $("#submitBtnLabel"), icon = $("#submitBtnIcon"), errB = $("#formError");
      errB.classList.remove("show");
      btn.disabled = true;
      icon.style.display = "none";
      label.insertAdjacentHTML("beforebegin", '<span class="btn-spin" id="btnSpin"></span>');
      label.textContent = "جارٍ الدخول…";
      try {
        await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#password").value);
        /* التحويل يصير تلقائياً من onAuthStateChanged */
      } catch (e) {
        errB.textContent = AUTH_ERR[e.code] || "تعذّر تسجيل الدخول (" + (e.code || e.message) + ")";
        errB.classList.add("show");
        btn.disabled = false;
        const spin = $("#btnSpin"); if (spin) spin.remove();
        icon.style.display = "";
        label.textContent = "تسجيل الدخول";
      }
    }

    $("#loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
  </script>

  <!-- سكريبت زخرفي بحت: تبديل إظهار كلمة المرور + نبضة الشعار بعد ظهوره + تنظيف الأداء -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const password = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const eyeIcon = document.getElementById("eyeIcon");

      togglePassword.addEventListener("click", () => {
        const isPassword = password.type === "password";
        password.type = isPassword ? "text" : "password";
        togglePassword.setAttribute("aria-label", isPassword ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
        eyeIcon.innerHTML = isPassword
          ? `<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-3.1 4.3"/><path d="M6.6 6.6C3.6 8.7 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4.2-.9"/>`
          : `<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>`;
      });

      const brandWrap = document.getElementById("brandWrap");
      const brandCircle = document.getElementById("brandCircle");
      if (brandWrap && brandCircle) {
        brandWrap.addEventListener("animationend", function onEnd(e) {
          if (e.target !== brandWrap) return;
          brandCircle.classList.add("pulsing");
          brandWrap.removeEventListener("animationend", onEnd);
        });
      }

      document.querySelectorAll(".cascade-item").forEach((el) => {
        el.addEventListener("animationend", function onEnd(e) {
          if (e.target !== el) return;
          el.style.willChange = "auto";
          el.removeEventListener("animationend", onEnd);
        });
      });
    });
  </script>

</body>
</html>
